name: Build APK CLI (Android 11)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools via apt
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt apksigner dx curl

      - name: Download Android API Jar
        run: |
          mkdir -p build/sdk
          # 例として安定の Android 31 または 34 などの android.jar を直接取得
          curl -L -o android.jar https://raw.githubusercontent.com/Sable/android-platforms/master/android-31/android.jar


      - name: Build APK via Raw Commands
        run: |
          mkdir -p build/gen build/obj build/apk

          # 正しい Android SDK の android.jar パスを指定
          ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          PLATFORM_JAR="android.jar"

          echo "Using Android Jar: $PLATFORM_JAR"

          # 1. リソースのコンパイル (aapt)
          echo "--- Compiling Resources ---"
          aapt package -f -M AndroidManifest.xml -S res -I $PLATFORM_JAR -F build/apk/unaligned.apk

          # 2. Javaのコンパイル
          echo "--- Compiling Java ---"
          find . -name "*.java" > build/sources.txt
          javac -cp android.jar -d build/obj @build/sources.txt

                    # 3. dex化 (d8 を使用)
          echo "--- Converting to Dalvik Executable ---"
          cd build/obj
          jar cvf classes.jar *
          
          # Android SDK 内の d8 を使って確実に dex 化
          # (あらかじめ SDK の build-tools から d8 を見つけるか、グローバルの d8 を呼ぶ)
          ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          D8_PATH=$(find "$ANDROID_SDK_ROOT/build-tools" -name "d8" | sort | tail -n 1)
          
          if [ -n "$D8_PATH" ]; then
            "$D8_PATH" --output ../apk/ classes.jar
          else
            d8 --output ../apk/ classes.jar
          fi
          cd ../..


          # 4. APKに追加 & 署名
          cd build/apk
          if [ -f classes.dex ]; then
            zip -u unaligned.apk classes.dex
          fi
          
          if [ -d "../../assets" ]; then
            cd ../..
            cd assets && zip -r ../build/apk/unaligned.apk . && cd ..
            cd build/apk
          fi

          # デバッグ署名
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android unaligned.apk
          mv unaligned.apk ../../app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-android11
          path: app-release.apk
