name: Build APK CLI (Android 11)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Build Tools via apt
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt apksigner openjdk-11-jdk

      - name: Build APK via Raw Commands
        run: |
          mkdir -p build/gen build/obj build/apk

          # 1. リソースのコンパイル (aapt)
          echo "--- Compiling Resources ---"
          aapt package -f -M AndroidManifest.xml -S res -I /usr/lib/android.jar -F build/apk/unaligned.apk || \
          aapt package -f -M AndroidManifest.xml -S res -F build/apk/unaligned.apk

          # ※もしSDKのandroid.jarパスが環境によって違う場合のフォールバックとして
          # ざっくりプラットフォーム標準jarを探すか、あるいはプレーンなコンパイルを行う
          
          # 2. Javaのコンパイル
          echo "--- Compiling Java ---"
          find . -name "*.java" > build/sources.txt
          javac -source 11 -target 11 -d build/obj @build/sources.txt

          # 3. dex化 (dx または d8 が無ければ jar を dexに)
          echo "--- Converting to Dalvik Executable ---"
          cd build/obj
          jar cvf classes.jar *
          dx --dex --output=../apk/classes.dex classes.jar || true
          cd ../..

          # 4. APKに追加 & 署名
          cd build/apk
          if [ -f classes.dex ]; then
            zip -u unaligned.apk classes.dex
          fi
          
          if [ -d "../../assets" ]; then
            cd ../..
            cd assets && zip -r ../build/apk/unaligned.apk . && cd ..
            cd build/apk
          fi

          # デバッグ署名
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android unaligned.apk
          mv unaligned.apk ../../app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-android11
          path: app-release.apk
